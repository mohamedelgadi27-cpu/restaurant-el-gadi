<html lang="fr" dir="ltr">

    <title>Restaurant EL GADI | VIP Gastronomy & Sushi Bar</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #070707;
            --bg-card: #121212;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa8c2c;
            --text-main: #f5f5f5;
            --text-muted: #9e9e9e;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Header & Nav */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(7, 7, 7, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--gold-light);
            letter-spacing: 2px;
            font-weight: 700;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--gold-primary);
        }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 0.4rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
        }

        .lang-btn:hover {
            background: var(--gold-primary);
            color: var(--bg-deep);
        }

        /* Hero Section VIP */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(7,7,7,0.5), rgba(7,7,7,0.85)), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
            position: relative;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: var(--gold-light);
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 650px;
            margin-bottom: 2rem;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: var(--bg-deep);
            padding: 1rem 2.5rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
            transition: var(--transition);
            display: inline-block;
        }
